<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- players are minors: keep the site out of search engines and AI training sets -->
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, noai, noimageai">
<title>LQHF · Saison</title>
<meta name="description" content="Classements, calendrier, résultats, statistiques et prédictions de la saison LQHF (M12, M15). Site non officiel.">
<link rel="icon" type="image/png" sizes="32x32" href="logos/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="logos/favicon-16.png">
<link rel="apple-touch-icon" href="logos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="LQHF">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#201943">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Palette from the LQHF crest: deep navy, sky blue, a touch of pink. */
:root{
  --bg:#f2f4f9;--surface:#fff;--ink:#141233;--muted:#5a5f7d;--line:#d9dcea;--soft:#e6f1fa;
  --accent:#1c6a9e;--sky:#3e98ca;--pink:#c2407f;--navy:#201943;--win:#1d7a4d;--loss:#b3261e;--tie:#6b6f86;--warn:#9a5a00;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a1c;--surface:#15132d;--ink:#eceaf7;--muted:#a09fbd;--line:#29274d;--soft:#18284a;
  --accent:#72c3ef;--sky:#3e98ca;--pink:#f08cc0;--win:#53c78f;--loss:#ff8a80;--tie:#a5a8bf;--warn:#f0a548;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0a1c;--surface:#15132d;--ink:#eceaf7;--muted:#a09fbd;--line:#29274d;--soft:#18284a;
  --accent:#72c3ef;--sky:#3e98ca;--pink:#f08cc0;--win:#53c78f;--loss:#ff8a80;--tie:#a5a8bf;--warn:#f0a548;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
a{color:var(--accent);text-underline-offset:2px;text-decoration-thickness:1px}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* masthead */
.mast{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.mast:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--sky) 0 70%,#e46fb0 70% 100%)}
.mast .wrap{display:flex;align-items:center;gap:18px;padding-block:18px 22px;flex-wrap:wrap}
.crest{flex:none;display:block}
.crest img{display:block;height:84px;width:auto}
.mt{flex:1 1 260px;min-width:0}
.eyebrow{font:700 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:#8fd0f5}
.mast h1{margin:2px 0 0;font:800 italic clamp(28px,5vw,44px)/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.unoff{margin:4px 0 0;font:500 13px/1.3 var(--body);color:#b9c6e4}
.unoff a{color:#cfe9f9}
/* the "unofficial" flag: red like the ribbon of the site's icon */
.uo{display:inline-block;border:0;cursor:pointer;padding:2px 8px 1px;border-radius:4px;background:#d7262e;color:#fff;font:700 12px/1.4 var(--display);letter-spacing:.08em;text-transform:uppercase;vertical-align:1px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pills a{font:800 italic 15px var(--display);letter-spacing:.05em;text-transform:uppercase;color:#fff;text-decoration:none;border:1.5px solid #3e98ca;padding:4px 13px;border-radius:99px}
.pills a[aria-current="page"]{background:var(--sky);border-color:var(--sky);color:var(--navy)}
.pills a:hover{background:rgba(62,152,202,.25)}
.tools{display:flex;gap:6px;align-self:flex-start}
.tools button{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;background:transparent;color:#cfe9f9;border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:5px 10px;cursor:pointer}
/* Phones: a compact masthead in three rows. Small crest beside the eyebrow (language button top right) and the
   season with the "unofficial" flag after it, then the division pills full width, on one line that scrolls sideways. */
@media(max-width:600px){
 .mast .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 12px;align-items:center;padding-block:12px 16px}
 .mt{display:contents}
 .crest{grid-column:1;grid-row:1/3}
 .crest img{height:46px}
 .eyebrow{grid-column:2;grid-row:1;align-self:end;font-size:11px;letter-spacing:.1em}
 .tools{grid-column:3;grid-row:1;align-self:center}
 .tools button{padding:4px 8px;font-size:12px}
 /* the season and the flag share a line; the flag drops below when the line is too narrow */
 .ttl{grid-column:2/4;grid-row:2;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
 .mast h1{margin:0;font-size:clamp(19px,5.9vw,26px);white-space:nowrap}
 .unoff{margin:2px 0 0;line-height:1}
 .uo{font-size:11px;padding:2px 6px 1px;white-space:nowrap}
 .pills{grid-column:1/-1;grid-row:3;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:10px -16px 0;padding-inline:16px}
 .pills::-webkit-scrollbar{display:none}
 .pills a{flex:none;font-size:14px;padding:4px 11px}
}
/* tabs */
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-decoration:none;padding:12px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--sky)}
nav.tabs a:hover{color:var(--ink)}
main{padding-block:24px 40px;min-height:50vh}
h2{font:800 italic 26px/1.1 var(--display);text-transform:uppercase;margin:32px 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
main>h2:first-child,.first{margin-top:0}
h2 small{font:500 14px var(--body);text-transform:none;color:var(--muted)}
h3{font:700 14px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.grid2>*,.grid3>*{min-width:0}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
select,input[type=search]{font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px 10px;max-width:100%}
input[type=search]{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg a,.seg button{font:700 14px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer}
.seg [aria-current="true"],.seg [aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .seg [aria-pressed="true"],:root[data-theme="dark"] .seg [aria-current="true"]{background:var(--sky);color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg [aria-pressed="true"],:root:not([data-theme="light"]) .seg [aria-current="true"]{background:var(--sky);color:var(--navy)}}
.btn{font:700 14px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.on{background:#e46fb0;border-color:#e46fb0;color:#fff}
.more{display:block;margin:12px auto 0}
/* logos */
.lg{display:inline-block;vertical-align:middle;object-fit:contain;flex:none;max-width:none;border-radius:4px}
.lg.ph{background:var(--soft);color:var(--accent);font:800 11px/1 var(--display);display:inline-flex;align-items:center;justify-content:center}
.tl{display:inline-flex;align-items:center;gap:8px;min-width:0}
.tl span{overflow-wrap:anywhere}
a.tl{color:inherit;text-decoration:none}
a.tl:hover span{text-decoration:underline}
/* game rows */
.day{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 2px 6px}
.day:first-child{padding-top:0}
.gl{list-style:none;margin:0;padding:0}
.gr{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.gl li:first-child .gr{border-top:0}
.gr:hover{background:var(--soft)}
.gr .tm{font:700 17px var(--display);font-variant-numeric:tabular-nums;line-height:1.1}
.gr .tm small{display:block;font:500 12px var(--body);color:var(--muted);margin-top:2px}
.gr .tm small.ck{margin-top:1px;font-weight:700;color:var(--accent)}
.gr .sides>div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;min-height:26px}
.gr .sides .ph{color:var(--muted);font-weight:500;font-style:italic}
.gr .sc{font:800 italic 20px var(--display);font-variant-numeric:tabular-nums;min-width:18px;text-align:right}
.gr .w{color:var(--accent)}
.gr .me{background:linear-gradient(90deg,var(--soft),transparent);margin-inline:-6px;padding-inline:6px;border-radius:3px}
.chip{font:700 11px var(--display);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:var(--soft);color:var(--muted);white-space:nowrap;display:inline-block}
.chip.final{background:var(--navy);color:#fff}
.chip.live{background:#c62828;color:#fff}
.chip.W{background:var(--win);color:#fff}.chip.L{background:var(--loss);color:#fff}.chip.T{background:var(--tie);color:#fff}
.chip.T_{background:#fde4f1;color:#8a1f55}
.chip.X{background:transparent;border:1px solid var(--line)}
.chip.off{background:transparent;color:var(--warn);border:1px solid currentColor}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.final{background:#2d3a66}:root:not([data-theme="light"]) .chip.T_{background:#4a1f37;color:#ffc1e1}}
:root[data-theme="dark"] .chip.final{background:#2d3a66}:root[data-theme="dark"] .chip.T_{background:#4a1f37;color:#ffc1e1}
@media(max-width:460px){.gr{grid-template-columns:54px minmax(0,1fr) auto;gap:8px;padding-inline:10px}.gr .chip{font-size:10px;padding:2px 5px}}
/* tables */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap}
th{font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line);position:sticky;top:0}
td{border-top:1px solid var(--line)}
tbody tr:first-child td{border-top:0}
th.l,td.l{text-align:left}
/* goalies: games played alone, centred under its two-line heading */
.gt-l :is(td,th):nth-child(6),.gt-t :is(td,th):nth-child(4){text-align:center}
td.tn{white-space:normal;min-width:180px}
th button{all:unset;cursor:pointer}
th button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
tr.me td{background:var(--soft)}
td b{font-weight:700}
.rk{color:var(--muted);width:28px}
.pts{font-weight:700}
/* player page: a game where another goalie of her team was dressed too */
.gkst td.tn .tl span{overflow-wrap:normal;word-break:normal}
@media (max-width:600px){.gkst :is(th,td){padding-inline:5px}.gkst th{white-space:normal;vertical-align:bottom}.gkst td.tn{max-width:110px;white-space:normal}.gkst td.tn .tl span{overflow-wrap:break-word}}
tr.gksh>td{color:var(--muted)}tr.gksh .chip{opacity:.6}
.gkw{font-size:12px;color:var(--muted);white-space:normal;margin-top:2px}
.aff{font:700 10px var(--display);letter-spacing:.08em;color:#8a1f55;background:#fde4f1;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .aff{background:#4a1f37;color:#ffc1e1}}
:root[data-theme="dark"] .aff{background:#4a1f37;color:#ffc1e1}
.form{display:inline-flex;gap:3px}
.form i{font:700 11px/18px var(--display);width:18px;height:18px;text-align:center;border-radius:3px;color:#fff;font-style:normal}
.form .W{background:var(--win)}.form .L{background:var(--loss)}.form .T{background:var(--tie)}
.cut td{border-top:2px solid var(--sky)}
/* league cards */
.lc{display:block;text-decoration:none;color:var(--ink);padding:16px;border-top:4px solid var(--sky)}
.lc:hover{border-color:var(--line);border-top-color:#e46fb0}
.lc b{font:800 italic 30px/1 var(--display);text-transform:uppercase;display:block}
.lc span{color:var(--muted);font-size:13px}
.prog{height:5px;background:var(--soft);border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--sky)}
/* team header */
.th{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.th .lg{width:72px;height:72px}
.th h2{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:16px}
.kpi{background:var(--surface);padding:10px 12px}
.kpi b{display:block;font:800 italic 26px/1.05 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
/* game page */
.board{padding:18px 16px;text-align:center}
.board .meta{font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:14px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.vs .side a{color:inherit}
.vs .lg{width:60px;height:60px}
.vs .big{font:800 italic clamp(40px,9vw,64px)/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.vs .big.tbd{font-size:24px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;margin-top:14px;font-size:14px;color:var(--muted)}
.odds .ob{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft)}
.odds .ob i{display:block;height:100%}
.odds .oh{background:var(--sky)}.odds .ot{background:var(--tie);opacity:.55}.odds .ov{background:#e46fb0}
.odds{display:flex;flex-direction:column-reverse;gap:6px;max-width:480px;margin-inline:auto}
/* one compact row: visitor left, tie in the middle, home right (as on the scoreboard), the bar below in the same order */
.odds .ol{display:flex;justify-content:space-between;align-items:center;gap:8px}
.odds .ol>div{display:flex;align-items:center;gap:6px;color:var(--muted);background:none;opacity:1}
.odds .ol>.oh{flex-direction:row-reverse}
.odds .ol b{font:800 20px/1 var(--display);font-variant-numeric:tabular-nums}
.odds .ol>.fav b{color:var(--ink)}
.odds .ol>.ot b{font-size:16px}
.odds .ol small{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.odds .ol>:not(.ot) small,.odds .ol .oeq{display:none}
.odds .ol .lg{width:28px;height:28px}
.odds .ob{height:8px}
/* the predicted score, laid out like the scoreboard: visitor left, home right */
.psc{display:flex;justify-content:center;align-items:center;gap:12px;margin:14px auto 0;padding-top:12px;border-top:1px solid var(--line);max-width:480px}
.psc small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.psc span{display:flex;align-items:center;gap:8px}
.psc b{font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.pg{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:baseline;margin:0}
.ev{list-style:none;margin:0;padding:0}
.ev li{display:grid;grid-template-columns:48px 26px minmax(0,1fr);gap:8px;align-items:center;padding:7px 14px;border-top:1px solid var(--line)}
.ev li.per{display:block;border-top:0;font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--soft);padding:6px 14px}
.ev .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.ev small{color:var(--muted)}
.bar{display:inline-block;height:8px;border-radius:4px;vertical-align:middle;background:var(--sky)}
.bar.neg{background:#e46fb0}
.err{color:var(--loss)}
.res{display:flex;flex-direction:column}
.res a{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.res a:first-child{border-top:0}
.res a:hover{background:var(--soft)}
.res small{color:var(--muted);margin-left:auto;text-align:right}
footer{color:var(--muted);font-size:13px;padding-block:20px 40px;border-top:1px solid var(--line)}
footer p{margin:4px 0}
.crumb{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.crumb a{text-decoration:none}
.empty{padding:16px;color:var(--muted)}
/* tooltips: dotted underline = hover, focus or tap for the explanation */
abbr.ab{text-decoration:underline dotted;text-underline-offset:3px;cursor:help;text-decoration-color:var(--muted)}
th button[data-tip]{text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--muted)}
th button[aria-pressed="true"]{text-decoration-style:solid}
.tipbox{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 16px));background:var(--navy);color:#fff;font:500 13px/1.35 var(--body);padding:7px 10px;border-radius:5px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;text-transform:none;letter-spacing:0;white-space:normal}
:root[data-theme="dark"] .tipbox{background:#2d3a66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tipbox{background:#2d3a66}}
abbr.aff{text-decoration:none;cursor:help}
/* predictions */
.dist{display:inline-flex;gap:2px;vertical-align:middle}
.dist i{display:block;width:10px;height:18px;border-radius:2px}
/* staff */
.staff{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.staff dt{font:700 12px/1.6 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.staff dd{margin:0;font-weight:600;display:flex;flex-wrap:wrap;gap:2px 14px}
.staff .sfo{color:var(--muted);font-weight:400}
.staff .sfn{font-weight:400;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* rules */
.isl{list-style:none;margin:0;padding:0}
.iss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:11px 14px;border-top:1px solid var(--line)}
.isl .iss:first-child{border-top:0}
.iss .it{margin-bottom:3px;font-weight:600}
.iss .ig{font-size:13px;margin-top:4px}
.chip.bad{background:var(--loss);color:#fff}
.chip.chk{background:transparent;color:var(--warn);border:1px solid currentColor}
.rbadge{display:inline-block;font:700 13px var(--display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#fff;background:var(--loss);padding:5px 10px;border-radius:4px}
.rbadge.w{background:transparent;color:var(--warn);border:1px solid currentColor}
.tban{display:block;margin-bottom:18px;text-decoration:none;color:var(--ink);border-left:4px solid #e46fb0}
.tban:hover{background:var(--soft)}
.tban b{font:800 italic 18px var(--display);text-transform:uppercase}
.watch th,.watch td{padding:6px 8px}
.watch td.l{white-space:normal}
.wg{margin:10px 0 0;font-size:14px}
/* progression chart: 3 focus colours (validated all-pairs on both surfaces), context lines recessive */
body{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ctx:#bfc4d9;--grid:#eceef5;--axis:#b9bdd2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ctx:#35335f;--grid:#1f1d3e;--axis:#4a4878}}
:root[data-theme="dark"] body{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ctx:#35335f;--grid:#1f1d3e;--axis:#4a4878}
.pgy{font-size:13px;margin-bottom:6px}
.pgsvg{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.pgsvg text{font:500 11px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.pgsvg text.lab{font:600 12px var(--body);fill:var(--ink)}
.pgsvg .gl{stroke:var(--grid);stroke-width:1}.pgsvg .g0{stroke:var(--axis);stroke-width:1}
.pgsvg path.c{fill:none;stroke:var(--ctx);stroke-width:1.25;stroke-linejoin:round}
.pgsvg path.c.hov{stroke:var(--muted);stroke-width:2}
.pgsvg path.halo{fill:none;stroke:var(--surface);stroke-width:6;stroke-linejoin:round}
.pgsvg path.f{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pgsvg circle.dot{stroke:var(--surface);stroke-width:2}
.pgsvg path.pj{stroke-dasharray:5 4}.pgsvg path.f.pj{stroke-width:2}
.pgsvg .xt{stroke:var(--axis);stroke-width:1}
.pgsvg tspan.lv{font-weight:500;fill:var(--muted)}
.pgsvg path.band{opacity:.13;stroke:none}
.pgsvg circle.gp{stroke:var(--surface);stroke-width:1.5;opacity:.9}
.pgvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:0 0 14px}
.pgv{border-top:4px solid var(--sky)}
.pgvn .tl{font:700 15px var(--body)}
.pgvv{margin-top:8px}.pgvv .tdn{font-size:22px}
.pgvp{font-size:13px;margin-top:2px;min-height:1em}
.pgk{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;margin-top:12px}
.pgk b{display:block;font:800 italic 22px/1.05 var(--display);font-variant-numeric:tabular-nums}
.pgk span{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pgk small{display:block;font-size:12px;color:var(--muted)}
.pgsvg .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.pgsvg rect.hit{fill:transparent;cursor:crosshair}
.pgcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pgc{display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);cursor:pointer}
.pgc[aria-pressed="true"]{border-color:var(--ink)}
.pgc.x{color:var(--muted);border-style:dashed}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ctx,#b9bdd2);flex:none}
.pgr{display:inline-flex;align-items:center;gap:6px}
.pgb{background:none;border:0;padding:4px;cursor:pointer;line-height:0}
.tdn{font:700 13px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tdn.up{color:var(--win)}.tdn.dn{color:var(--loss)}
.tipbox .tr{display:flex;align-items:center;gap:7px;margin-top:3px}.tipbox .tr i{width:9px;height:9px;border-radius:50%;flex:none}
.tipbox .tr span{flex:1}.tipbox .tr b{font-variant-numeric:tabular-nums;margin-left:10px}

/* ---------- narrow screens (phones) ---------- */
nav.tabs:before,nav.tabs:after{content:"";position:absolute;top:0;bottom:1px;width:28px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:1}
nav.tabs:before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
nav.tabs:after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
nav.tabs.ml:before,nav.tabs.mr:after{opacity:1}
.pgadd{display:none}
.vsh{display:none}
@media (max-width:600px){
  th,td{padding:7px 6px}
  td.tn{min-width:0}
  .tbm td .tl{max-width:150px}
  .tbm td .tl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;overflow-wrap:normal}
  /* the name column stays in view while the numbers scroll */
  .sk1 td:nth-child(1),.sk2 td:nth-child(2){position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:inset -1px 0 var(--line)}
  .sk1 th:nth-child(1),.sk2 th:nth-child(2){position:sticky;left:0;z-index:2;box-shadow:inset -1px 0 var(--line)}
  .sk1 tr.me td:nth-child(1),.sk2 tr.me td:nth-child(2){background:var(--soft)}
  .sk1 td:nth-child(1)>a:not(.tl),.sk2 td:nth-child(2)>a:not(.tl){display:inline-block;max-width:140px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  /* standings: BP, BC, PUN, streak hidden (overall view: one more column, the sector, also hidden) */
  .t-st:not(.t-all) :is(td,th):is(:nth-child(8),:nth-child(9),:nth-child(11),:nth-child(13)){display:none}
  .t-all :is(td,th):is(:nth-child(3),:nth-child(9),:nth-child(10),:nth-child(12),:nth-child(14)){display:none}
  /* leaders and goalies: jersey, position, pts/gp, PIM, dressed, GA hidden; the team as its logo */
  .pt-l :is(td,th):is(:nth-child(4),:nth-child(5),:nth-child(10),:nth-child(11)){display:none}
  .pt-l td:nth-child(3) .tl span,.gt-l td:nth-child(3) .tl span{display:none}
  .pt-l th:nth-child(3),.gt-l th:nth-child(3){font-size:0}
  .pt-l td:nth-child(3) .lg,.gt-l td:nth-child(3) .lg{width:24px;height:24px;max-width:none}
  .pt-t :is(td,th):is(:nth-child(3),:nth-child(8),:nth-child(9)){display:none}
  .gt-l :is(td,th):is(:nth-child(4),:nth-child(5),:nth-child(8)){display:none}
  .tbm.gt-l td:nth-child(2)>a:not(.tl){max-width:80px}
  .gt-l :is(td,th):first-child{padding-inline:4px 2px}
  .gt-l :is(td,th){padding-inline:5px}
  .gt-l :is(td,th):last-child{padding-right:10px}
  .gt-t :is(td,th):is(:nth-child(3),:nth-child(6)){display:none}
  /* predictions: GP, games left, remaining schedule, average rank hidden */
  .t-pr :is(td,th):is(:nth-child(4),:nth-child(5),:nth-child(6),:nth-child(8)){display:none}
  /* progression: GP, chance, end of season hidden (the verdict carries them); no bar */
  .t-pg :is(td,th):is(:nth-child(2),:nth-child(3),:nth-child(5),:nth-child(6)){display:none}
  .tbm th{white-space:normal;vertical-align:bottom}
  .t-pg td .tl{max-width:120px}
  .tbm.pt-l td:nth-child(2)>a:not(.tl){max-width:120px}
  .t-pg .bar{display:none}.t-pg .vl{display:none}.t-pg .vsh{display:inline}
  /* team page header */
  .th{gap:10px 12px;flex-wrap:nowrap}
  .th .lg{width:48px;height:48px}
  .th h2{font-size:22px}
  .tsub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
  .th .btn{padding:6px 10px;font-size:13px}
  /* progression: larger chart text; compare through a menu instead of 15 buttons */
  .pgsvg text{font-size:12px}
  .pgadd{display:block;margin-top:12px;max-width:100%}
  .pgcs .pgc[aria-pressed="false"]{display:none}
  .pgcs:not(:has(.pgc[aria-pressed="true"])){display:none}
}

/* The odds of a game, shared by every site in websites/ (inserted by each build.py): from the two teams' ratings
   (websites/common/ratings.py) and BASE, the average goals per team per game. Each team's goals follow a Poisson law
   whose mean is BASE shifted by half the rating difference (capped at 4, never under 0.3). */
const PRED={
  lam(rh,rv,base){const d=Math.max(-4,Math.min(4,rh-rv));return[Math.max(.3,base+d/2),Math.max(.3,base-d/2)]},
  /* w/t/l: home win, tie, away win; eh/ev: expected goals; sh/sv: the predicted score in whole goals, the most likely
     score of the most likely result (so it agrees with the odds). */
  odds(rh,rv,base){
    const[mh,mv]=PRED.lam(rh,rv,base),pm=m=>{const p=[Math.exp(-m)];for(let i=1;i<=15;i++)p.push(p[i-1]*m/i);return p},ph=pm(mh),pv=pm(mv);
    let w=0,t=0,l=0;const best=[[0,0,-1],[0,0,-1],[0,0,-1]];
    for(let i=0;i<=15;i++)for(let j=0;j<=15;j++){const p=ph[i]*pv[j],o=i>j?0:i===j?1:2;if(o===0)w+=p;else if(o===2)l+=p;else t+=p;if(p>best[o][2])best[o]=[i,j,p]}
    const s=w+t+l,top=w>=t&&w>=l?0:l>=t?2:1;
    return{w:w/s,t:t/s,l:l/s,eh:mh,ev:mv,sh:best[top][0],sv:best[top][1]};
  }
};

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DTF={};const fmt=(iso,o,loc)=>{const k=JSON.stringify([o,loc||LANG]);return (DTF[k]??=new Intl.DateTimeFormat(loc||(LANG==='fr'?'fr-CA':'en-CA'),{timeZone:TZ,...o})).format(new Date(iso))};

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dLong=iso=>cap(fmt(iso,{weekday:'long',day:'numeric',month:'long'}));
const dShort=iso=>fmt(iso,{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');
const dTiny=iso=>fmt(iso,{day:'numeric',month:'short'}).replace(/\./g,'');

const signed=(x,n=2)=>(x>0?'+':x<0?'−':'')+Math.abs(x).toFixed(n);
const pct=x=>Math.round(x*100)+'%';

const sector=p=>String(p||'').split(' - ').pop();

/* ---------- data ---------- */
const DATA={};
const lmeta=k=>IX.leagues.find(l=>l.key===k);
async function getL(k,fresh){
  if(DATA[k]&&!fresh)return DATA[k];
  const r=await fetch(`data/${k}.json?v=${fresh?Date.now():lmeta(k).v}`,fresh?{cache:'no-store'}:{});
  if(!r.ok)throw new Error(r.status);
  return DATA[k]=prep(await r.json());
}
function prep(d){
  const now=Date.now();
  d.byId={};d.mine=new Set(d.standings.map(s=>s.t).filter(k=>!d.league[k]||d.league[k]===d.key)); // a team moved to another league mid-season belongs to the new one
  d.stand={};d.standings.forEach(s=>d.stand[s.t]=s);
  d.rmap={};for(const[k,rows]of Object.entries(d.roster))d.rmap[k]=Object.fromEntries(rows.map(r=>[r[0],r]));
  for(const g of d.games){
    d.byId[g.id]=g;g.t0=+new Date(g.s);g.t1=+new Date(g.e);
    /* Spordle marks a game 'played' 0-0 as soon as it starts: live while g.live is set, or played without an end time inside its time slot. */
    g.on=!!g.live||(g.st==='played'&&!g.end&&now>=g.t0&&now<g.t1);
    if(g.on&&!g.sc)g.sc=[0,0];
    g.done=g.st==='played'&&!g.on&&!!g.sc;
  }
  return d;
}
const tm=(d,k)=>d.teams[k]||IX.teams[k]&&{n:IX.teams[k][1],lg:IX.teams[k][2]}||{n:'?'};

function logo(d,k,sz=24){const m=tm(d,k);return m.lg?`<img class="lg" src="logos/${m.lg}.png" width="${sz}" height="${sz}" alt="" loading="lazy">`:`<span class="lg ph" style="width:${sz}px;height:${sz}px">${esc((m.n||'?').replace(/[^A-Za-zÀ-ÿ]/g,'').slice(0,2))}</span>`}
function tlink(d,k,sz=22,full){const h=teamHref(d,k),n=esc(full?tm(d,k).n:tn(d,k));return h?`<a class="tl" href="${h}">${logo(d,k,sz)}<span>${n}</span></a>`:`<span class="tl">${logo(d,k,sz)}<span>${n}</span></span>`}

/* ---------- tooltips: any [data-tip] element; one floating box so tables that scroll do not clip it ---------- */
const TIP=document.createElement('div');TIP.className='tipbox';TIP.setAttribute('role','tooltip');TIP.hidden=true;document.body.appendChild(TIP);
function showTip(el){const s=el.dataset.tip;if(!s)return;TIP.textContent=s;TIP.hidden=false;const r=el.getBoundingClientRect(),w=TIP.offsetWidth,h=TIP.offsetHeight;
  TIP.style.left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8))+'px';TIP.style.top=(r.top-h-8<8?r.bottom+8:r.top-h-8)+'px'}
const hideTip=()=>{TIP.hidden=true};
document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');el?showTip(el):hideTip()});

addEventListener('scroll',hideTip,true);
const tipOf=k=>(t('tip')||{})[k]||'';
/* An abbreviation with its explanation: hover, focus or tap shows it. */
const ab=(key,lab)=>{lab=lab??(t('c')[key]??(t('c2')||{})[key]??key);const tp=tipOf(key);return tp?`<abbr class="ab" data-tip="${esc(tp)}" tabindex="0" aria-label="${esc(lab+' : '+tp)}">${esc(lab)}</abbr>`:esc(lab)};
const posAb=p=>{if(!p)return '';const tp=p.split('/').map(x=>(t('pos')||{})[x]||x).join(' / ');return `<abbr class="ab" data-tip="${esc(tp)}" tabindex="0">${esc(p)}</abbr>`};
const affTag=()=>`<abbr class="aff" data-tip="${esc(tipOf('AFF'))}" tabindex="0">AFF</abbr>`;

/* ---------- staff ---------- */
function staffHTML(rows,n){ // rows: [[role, name, games?, on game sheets only?]] in bench order; n: the team's games with a staff list
  const by=new Map();for(const[r,nm,c,o]of rows){if(!by.has(r))by.set(r,[]);by.get(r).push([nm,c,o])}
  const one=([nm,c,o])=>esc(nm)+(o?`<span class="sfo" title="${esc(t('staffOnly'))}">*</span>`:'')+(n&&c!=null?` <span class="sfn" title="${esc(t('staffGp',c,n))}">${c}/${n}</span>`:'');
  return `<dl class="staff">${[...by].map(([r,ns])=>`<dt>${esc((t('role')||{})[r]||r)}</dt><dd>${n?ns.map(x=>`<span>${one(x)}</span>`).join(''):ns.map(one).join(', ')}</dd>`).join('')}</dl>`;
}
/* A team's full staff (everyone on its game sheets this season), with the note under it. */
function teamStaffHTML(d,sf){
  return `${staffHTML(sf.sf,sf.n)}<p class="note">${t('staffAll',sf.n)}${sf.sf.some(r=>r[3])?' '+t('staffOnlyNote'):''}</p>`;
}

/* ---------- season simulation (seeded, so the numbers are stable for a given data version) ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let x=Math.imul(a^(a>>>15),1|a);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296}}
function SIM(d){
  if(d._sim)return d._sim;
  const N=4000,R=rng(parseInt(String(lmeta(d.key).v).slice(0,8),16)||1);
  const teams=d.standings.map(s=>s.t),idx=Object.fromEntries(teams.map((k,i)=>[k,i])),n=teams.length;
  const rem=d.games.filter(g=>g.k==='L'&&!g.done&&g.h&&g.v&&g.st!=='cancelled'&&idx[g.h]!=null&&idx[g.v]!=null);
  const pools=d.pools.map(p=>teams.filter(k=>d.stand[k].pool===p).map(k=>idx[k]));
  const r=teams.map(k=>(d.ratings[k]||{r:0}).r),sd=teams.map(k=>(d.ratings[k]||{sd:1.6}).sd);
  const rk=teams.map(()=>new Float64Array(n+1)),pts=new Float64Array(n),first=new Float64Array(n);
  const P=new Float64Array(n),GD=new Float64Array(n),S=new Float64Array(n);
  const pois=m=>{const L=Math.exp(-m);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1};
  const gauss=()=>{let u=0;while(!u)u=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*R())};
  const left=new Int32Array(n),oppSum=new Float64Array(n);
  for(const g of rem){const h=idx[g.h],v=idx[g.v];left[h]++;left[v]++;oppSum[h]+=r[v];oppSum[v]+=r[h]}
  const G=rem.map(g=>[idx[g.h],idx[g.v]]);
  for(let s=0;s<N;s++){
    for(let i=0;i<n;i++){const st=d.stand[teams[i]];P[i]=st.pts;GD[i]=st.gf-st.ga;S[i]=r[i]+gauss()*sd[i]}
    for(const[h,v]of G){const[mh,mv]=PRED.lam(S[h],S[v],d.base),a=pois(mh),b=pois(mv);
      if(a>b){P[h]+=3;P[v]+=1}else if(a<b){P[v]+=3;P[h]+=1}else{P[h]+=2;P[v]+=2}GD[h]+=a-b;GD[v]+=b-a}
    for(const pl of pools){const o=pl.map(i=>[i,P[i],GD[i],R()]).sort((x,y)=>y[1]-x[1]||y[2]-x[2]||y[3]-x[3]);o.forEach(([i],j)=>{rk[i][j+1]++;if(!j)first[i]++})}
    for(let i=0;i<n;i++)pts[i]+=P[i];
  }
  const out={};teams.forEach((k,i)=>{const pl=pools.find(p=>p.includes(i))||[];const dist=[...rk[i]].slice(1,pl.length+1).map(x=>x/N);
    out[k]={pts:pts[i]/N,first:first[i]/N,rank:dist.reduce((s,p,j)=>s+p*(j+1),0),dist,left:left[i],rsos:left[i]?oppSum[i]/left[i]:null}});
  return d._sim={N,teams:out,rem:rem.length};
}

/* Team summary over league games. */
function TI(d,k){
  d._ti??={};if(d._ti[k])return d._ti[k];
  const now=Date.now(),all=d.games.filter(g=>g.h===k||g.v===k),lg=all.filter(g=>g.k==='L'&&g.done);
  const R=lg.map(g=>res(g,k));let sk=0;for(let i=R.length-1;i>=0&&R[i]===R[R.length-1];i--)sk++;
  const per={f:{},a:{}},split={h:[0,0,0],v:[0,0,0]},infc={};let pim=0;
  for(const g of lg){
    for(const x of g.g||[]){const p=String(x[1]);(x[0]===k?per.f:per.a)[p]=((x[0]===k?per.f:per.a)[p]||0)+1}
    for(const x of g.p||[])if(x[0]===k){pim+=x[5]||0;infc[x[4]]=(infc[x[4]]||0)+1}

    live:all.find(g=>g.on),next:all.find(g=>!g.done&&!g.on&&g.st==='scheduled'&&g.t1>now),last:[...all].reverse().find(g=>g.done)};

/* Player stats per (player, team) pair, regular-season games only (tournaments and exhibitions never count). */
function PS(d){
  if(d._ps)return d._ps;
  const M=new Map(),get=(pk,tk)=>{const k=pk+'|'+tk;let r=M.get(k);if(!r)M.set(k,r={pk,tk,gp:0,g:0,a:0,pim:0,no:null,pos:''});return r};
  for(const g of d.games){
    if(!(g.done||g.on)||g.k!=='L')continue;
    /* skater stats: the games she dressed as a goalie count in the goalie stats (GS), not here */
    for(const[tk,no,pk,pos]of g.lu||[]){if(!pk||isG(pos))continue;const r=get(pk,tk);r.gp++;if(no!=null)r.no=no;if(pos)r.pos=pos}
    for(const[tk,,,s,...as]of g.g||[]){if(s)get(s,tk).g++;as.forEach(a=>a&&get(a,tk).a++)}
    for(const[tk,,,pl,,min]of g.p||[])if(pl)get(pl,tk).pim+=min||0;
  }
  const out=[...M.values()];
  for(const r of out){r.pts=r.g+r.a;const ro=d.rmap[r.tk]&&d.rmap[r.tk][r.pk];if(ro){if(ro[1]!=null)r.no=ro[1];r.pos=r.pos||ro[2];r.aff=!!ro[3]}}
  return d._ps=out;
}
function GS(d){
  if(d._gs)return d._gs;const M=new Map(),get=(pk,tk)=>{const k=pk+'|'+tk;let r=M.get(k);if(!r)M.set(k,r={pk,tk,dr:0,gp:0,w:0,l:0,t:0,ga:0,so:0,no:null});return r};
  for(const g of d.games){
    if(!g.done||g.k!=='L'||!g.lu)continue;
    for(const[tk,gf,ga]of[[g.h,g.sc[0],g.sc[1]],[g.v,g.sc[1],g.sc[0]]]){
      const gs=g.lu.filter(x=>x[0]===tk&&isG(x[3])&&x[2]);gs.forEach(x=>{const r=get(x[2],tk);r.dr++;if(x[1]!=null)r.no=x[1]});
      if(gs.length===1){const r=get(gs[0][2],tk);r.gp++;r.ga+=ga;r.so+=ga===0?1:0;r[gf>ga?'w':gf<ga?'l':'t']++}
    }
  }
  return d._gs=[...M.values()].map(r=>({...r,gaa:r.gp?r.ga/r.gp:null}));
}

     (unless the chip on the right already says so: a game not yet played) */
  const sub=o.date?dTiny(g.s):ck,sub2=o.date&&ck&&!cchip?`<small class="ck"${g.k==='T'?` data-tip="${esc(compLab(d,g))}"`:''}>${esc(ck)}</small>`:'';
  return `<li><a class="gr" href="#/${d.key}/game/${g.id}"><div class="tm">${hm(g.s)}<small>${esc(sub)}</small>${sub2}</div>
  <div class="sides"><div class="${g.v?'':'ph'}${meCls(g.v)}">${side('v')}${sc?`<span class="sc ${vw?'w':''}">${g.sc[1]}</span>`:''}</div><div class="${g.h?'':'ph'}${meCls(g.h)}">${side('h')}${sc?`<span class="sc ${hw?'w':''}">${g.sc[0]}</span>`:''}</div></div>${chip||'<span></span>'}</a></li>`;

function gList(d,games,o={}){
  if(!games.length)return `<div class="card empty">${t('noGames')}</div>`;
  if(o.flat)return `<ul class="gl card">${games.map(g=>gRow(d,g,{...o,date:true})).join('')}</ul>`;
  let out='',cur=null,buf=[];
  const flush=()=>{if(buf.length)out+=`<div class="day">${dLong(buf[0].s)}${dayKey(buf[0].s)===TODAY()?' · '+t('today'):''}</div><ul class="gl card">${buf.map(g=>gRow(d,g,o)).join('')}</ul>`;buf=[]};
  for(const g of games){const k=dayKey(g.s);if(k!==cur){flush();cur=k}buf.push(g)}flush();return out;
}
const moreBtn=(n,lim)=>n>lim?`<button class="btn more" data-act="more">${t('more',Math.min(LIM,n-lim))}</button>`:'';
const teamOpts=(d,sel)=>[...d.mine].sort((a,b)=>tn(d,a).localeCompare(tn(d,b),'fr')).map(k=>`<option value="${k}"${k===sel?' selected':''}>${esc(tn(d,k))}</option>`).join('');
const sortTh=(key,lab,cur,tk)=>{const tp=tipOf(tk||key);return `<th><button data-act="sort" data-v="${key}" aria-pressed="${cur===key}"${tp?` data-tip="${esc(tp)}" aria-label="${esc(lab+' : '+tp)}"`:''}>${lab}</button></th>`};

   <h2>${t('topPower')}</h2><div class="card scroll"><table><tbody>${pw.map(([k,v],i)=>`<tr${k===fav?' class="me"':''}><td class="rk">${i+1}</td><td class="l tn">${tlink(d,k)}</td><td><b>${signed(v.r)}</b></td></tr>`).join('')}</tbody></table></div><p class="note"><a href="#/${d.key}/progress">${t('progress')} →</a></p></div></div>`;

/* ---------- standings ---------- */

/* ---------- schedule ---------- */
function vSched(d){
  const u=U(),when=u.when||'up',team=u.team||'',comp=u.comp||'',lim=u.lim||LIM,today=TODAY();
  let gs=d.games.filter(g=>(!team||g.h===team||g.v===team)&&(!comp||g.k===comp));

  <select data-ui="comp" aria-label="${t('allComps')}"><option value="">${t('allComps')}</option>${['L','T','X'].map(k=>`<option value="${k}"${comp===k?' selected':''}>${t('comp')[k]}</option>`).join('')}</select></div>

  <tbody>${rows.map((r,i)=>`<tr${o.team&&r.tk===fav?' class="me"':''}>${o.rank?`<td class="rk">${i+1}</td>`:''}<td class="l">${plink(d,r.pk)}${r.aff?affTag():''}</td>${o.team?`<td class="l tn">${tlink(d,r.tk,18)}</td>`:''}<td>${r.no??''}</td><td class="l">${posAb(r.pos)}</td>${B('gp',r.gp)}${B('g',r.g)}${B('a',r.a)}${B('pts',r.pts)}${B('ppg',r.gp?(r.pts/r.gp).toFixed(2):'')}${B('pim',r.pim)}</tr>`).join('')}</tbody></table></div>`;

/* Players to watch in a coming game: each team's top 3 scorers and its main goalie, regular season only (like every
   stat), among the players still on the team's list. */
function watchHTML(d,g){
  const sides=[g.v,g.h].filter(Boolean);if(!sides.length)return '';
  const onList=(tk,pk)=>!d.rmap[tk]||!!d.rmap[tk][pk];
  const card=tk=>{
    const sk=PS(d).filter(r=>r.tk===tk&&r.pts>0&&!isG(r.pos)&&onList(tk,r.pk)).sort(pSort('pts')).slice(0,3);
    const gk=GS(d).filter(r=>r.tk===tk&&r.gp>0&&onList(tk,r.pk)).sort((a,b)=>b.gp-a.gp||a.gaa-b.gaa)[0];
    if(!sk.length&&!gk)return `<div class="card pad"><h3>${tlink(d,tk,18)}</h3><p class="muted" style="margin:0">${t('noStats')}</p></div>`;
    const c=t('c'),no=(pk,n)=>{const ro=d.rmap[tk]&&d.rmap[tk][pk];const x=ro&&ro[1]!=null?ro[1]:n;return x!=null?`<span class="muted">#${x}</span> `:''};
    return `<div class="card pad"><h3>${tlink(d,tk,18)}</h3>
     ${sk.length?`<table class="watch"><thead><tr><th class="l"></th><th>${ab('gp')}</th><th>${ab('g')}</th><th>${ab('a')}</th><th>${ab('ppts','PTS')}</th></tr></thead><tbody>${sk.map(r=>`<tr><td class="l">${no(r.pk,r.no)}${plink(d,r.pk)}${r.aff?affTag():''}</td><td>${r.gp}</td><td>${r.g}</td><td>${r.a}</td><td class="pts">${r.pts}</td></tr>`).join('')}</tbody></table>`:''}
     ${gk?`<p class="wg"><b>${t('watchG')}${t('colon')}</b> ${no(gk.pk,gk.no)}${plink(d,gk.pk)} · ${gk.w}-${gk.l}-${gk.t} · ${ab('gaa')} ${gk.gaa.toFixed(2)} · ${ab('so')} ${gk.so}</p>`:''}</div>`};
  return `<h2>${t('watchT')} <small>${t('watchSub')}</small></h2><div class="grid2">${sides.map(card).join('')}</div>`;

const pSort=s=>(a,b)=>s==='ppg'?((b.gp?b.pts/b.gp:0)-(a.gp?a.pts/a.gp:0)||b.pts-a.pts):s==='gp'?b.gp-a.gp||b.pts-a.pts:(b[s]-a[s])||(b.pts-a.pts)||(b.g-a.g)||(a.gp-b.gp);
/* The tab a view belongs to: the old Leaders and Goalies addresses open the Players tab. */
const TABV=v=>v==='leaders'||v==='goalies'?'players':v;
function vPlayers(d,arg){
  const g=arg==='goalies';
  return `<div class="filters"><div class="seg">${[['',t('leaders')],['goalies',t('goalies')]].map(([v,l])=>`<a href="#/${d.key}/players${v?'/'+v:''}" aria-current="${(v==='goalies')===g}">${l}</a>`).join('')}</div></div>${g?vGoalies(d):vLeaders(d)}`;

function vLeaders(d){

/* ---------- goalies ---------- */
function goalieTable(d,rows,o={}){
  const c=t('c'),s=o.sort||'gaa',B=(k,v)=>`<td${s===k?' class="pts"':''}>${v}</td>`;
  return `<div class="card scroll"><table class="tbm ${o.team?'sk2 gt-l':'sk1 gt-t'}"><thead><tr>${o.team?'<th>#</th>':''}<th class="l">${c.player}</th>${o.team?`<th class="l">${c.team}</th>`:''}<th>${ab('no')}</th>${sortTh('dr',c.dressed,s)}${sortTh('gp',t('gp1'),s)}<th>${ab('wlt',`${c.w}-${c.l}-${c.t}`)}</th>${sortTh('ga',c.ga,s,'gag')}${sortTh('gaa',c.gaa,s)}${sortTh('so',c.so,s)}</tr></thead>

}
function vGoalies(d){
  const u=U(),s=['dr','gp','ga','gaa','so'].includes(u.gsort)?u.gsort:'gaa',min=+(u.min||3),pool=u.pool||'';
  let rows=GS(d).filter(r=>d.mine.has(r.tk)&&(!pool||(d.stand[r.tk]&&d.stand[r.tk].pool===pool)));
  const q=rows.filter(r=>r.gp>=min),rest=rows.filter(r=>r.gp<min);
  const f={gaa:(a,b)=>a.gaa-b.gaa||b.gp-a.gp,so:(a,b)=>b.so-a.so||a.gaa-b.gaa,ga:(a,b)=>a.ga-b.ga,gp:(a,b)=>b.gp-a.gp,dr:(a,b)=>b.dr-a.dr}[s];
  const g0=(a,b)=>(a.gaa==null)-(b.gaa==null);q.sort((a,b)=>g0(a,b)||f(a,b));rest.sort((a,b)=>g0(a,b)||f(a,b)||b.dr-a.dr);
  return `<div class="filters"><select data-ui="pool" aria-label="${t('c').sector}"><option value="">${t('allPools')}</option>${d.pools.map(p=>`<option value="${esc(p)}"${p===pool?' selected':''}>${esc(sector(p))} ${conf(p)?' ('+esc(conf(p))+')':''}</option>`).join('')}</select>
  <select data-ui="min" aria-label="min">${[1,2,3,4,5].map(n=>`<option value="${n}"${n===min?' selected':''}>${t('minGp',n)}</option>`).join('')}</select></div>
  ${goalieTable(d,[...q,...rest],{team:1,sort:s,rank:q.length})}<p class="note">${t('goalieNote')}</p>`;
}

/* ---------- game ---------- */
function vGame(d,id){
  const g=d.byId[id];if(!g)return `<p class="err">?</p>`;

  const side=w=>{const k=g[w];return k?`<div class="side">${teamHref(d,k)?`<a href="${teamHref(d,k)}">${logo(d,k,60)}</a>`:logo(d,k,60)}${teamHref(d,k)?`<a href="${teamHref(d,k)}">${esc(tn(d,k))}</a>`:esc(tn(d,k))}<small class="muted">${w==='h'?t('home'):t('away')}</small></div>`:`<div class="side"><span class="muted">${esc(g[w+'p']||'?')}</span></div>`};
  const status=g.on?`<span class="chip live">${t('live')}${g.live&&g.live.period?' · '+esc(t('perS',String(g.live.period))):''}</span>`:g.done?`<span class="chip final">${t('st').played}</span>`:`<span class="chip${g.st!=='scheduled'?' off':''}">${t('st')[g.st]||g.st}</span>`;
  const board=`<div class="card board"><div class="meta">${esc(compLab(d,g))} · ${t('number',g.n)}</div>
   <div class="vs">${side('v')}<div><div class="big ${sc?'':'tbd'}">${sc?`${g.sc[1]} – ${g.sc[0]}`:t('vs')}</div><div style="margin-top:8px">${status}</div></div>${side('h')}</div>
   <div class="facts"><span>${dLong(g.s)} · ${hm(g.s)}</span>${a?`<span><a href="${mapUrl(a)}" target="_blank" rel="noopener" title="${esc(t('map'))}">${esc([a.n,a.ad,a.c].filter(Boolean).join(', '))}</a></span>`:''}${g.sp?`<span><a href="${lqhfUrl(g)}" target="_blank" rel="noopener">${t('lqhf')}</a></span>`:''}${g.k==='T'&&d.tourn[g.tn]&&d.tourn[g.tn].url?`<span><a href="${d.tourn[g.tn].url}#game-${encodeURIComponent(g.n)}" target="_blank" rel="noopener">${t('tSiteGame')} ↗</a></span>`:''}</div></div>`;
  const pred=g.h&&g.v&&(g.pr||!g.done&&!g.on)?(()=>{const o=oddsG(d,g),un=g.pr?[g.h,g.v].filter((k,i)=>g.pr[i]==null):[g.h,g.v].filter(k=>!d.ratings[k]);return `<h2>${g.pr?t('predFrozen'):t('pred')}</h2><div class="card pad">${oddsHTML(d,g.h,g.v,o)}<div class="psc" aria-label="${esc(t('expected'))} : ${esc(tn(d,g.v))} ${o.sv}, ${esc(tn(d,g.h))} ${o.sh}"><small>${t('expected')}</small><span>${logo(d,g.v,24)}<b>${o.sv} – ${o.sh}</b>${logo(d,g.h,24)}</span></div><p class="note" style="margin-top:12px">${un.length?t('unrated',un.map(k=>tn(d,k)).join(', '))+' ':''}${t('predNote')}</p></div>`})():'';
  const no=(tk,pk)=>{const l=(g.lu||[]).find(x=>x[0]===tk&&x[2]===pk);const ro=d.rmap[tk]&&d.rmap[tk][pk];const n=l&&l[1]!=null?l[1]:ro&&ro[1];return n!=null?`<small class="muted">#${n}</small> `:''};
  /* the lineup's own flag (she dressed for this game as an affiliate) wins; the roster when the lineup does not say */
  const isAff=(tk,pk)=>{const l=(g.lu||[]).find(x=>x[0]===tk&&x[2]===pk);if(l&&l[4]!=null)return l[4]===1;const ro=d.rmap[tk]&&d.rmap[tk][pk];return !!(ro&&ro[3])};
  const pers=[...new Set([...(g.g||[]),...(g.p||[])].map(x=>String(x[1])))].sort((a,b)=>(a==='OT'?4:a==='SO'?5:+a)-(b==='OT'?4:b==='SO'?5:+b));
  let line='';
  if(g.g&&g.g.length){const cnt=(tk,p)=>g.g.filter(x=>x[0]===tk&&String(x[1])===p).length;
    line=`<div class="card scroll" style="margin-bottom:12px"><table><thead><tr><th class="l"></th>${pers.map(p=>`<th>${esc(t('perS',p))}</th>`).join('')}<th>T</th></tr></thead><tbody>${[g.v,g.h].map(tk=>`<tr><td class="l">${tlink(d,tk,18)}</td>${pers.map(p=>`<td>${cnt(tk,p)}</td>`).join('')}<td class="pts">${g.g.filter(x=>x[0]===tk).length}</td></tr>`).join('')}</tbody></table></div>`}
  const evs=(arr,f)=>pers.map(p=>{const xs=arr.filter(x=>String(x[1])===p);return xs.length?`<li class="per">${esc(t('per',p))}</li>`+xs.map(f).join(''):''}).join('');
  const goals=g.g&&g.g.length?`<h2>${t('goals')}</h2>${line}<ul class="ev card">${evs(g.g,x=>`<li><span class="tm">${esc(x[2]||'')}</span>${logo(d,x[0],22)}<span>${no(x[0],x[3])}<b>${plink(d,x[3])}</b>${x.slice(4).filter(Boolean).length?` <small>(${x.slice(4).filter(Boolean).map(p=>plink(d,p)).join(', ')})</small>`:''}</span></li>`)}</ul>`:'';
  const pens=g.p&&g.p.length?`<h2>${t('penalties')}</h2><ul class="ev card">${evs(g.p,x=>`<li><span class="tm">${esc(x[2]||'')}</span>${logo(d,x[0],22)}<span>${no(x[0],x[3])}${plink(d,x[3])} <small>· ${esc(inf(x[4]))} · ${x[5]} min</small></span></li>`)}</ul>`:'';
  const lus=g.lu&&g.lu.length?`<h2>${t('lineups')}</h2><div class="grid2">${[g.v,g.h].filter(Boolean).map(tk=>{const L=g.lu.filter(x=>x[0]===tk).sort((a,b)=>(isG(b[3])-isG(a[3]))||((a[1]??999)-(b[1]??999)));const na=L.filter(x=>isAff(tk,x[2])).length;
     return `<div><h3>${tlink(d,tk,18)}</h3><div class="card scroll"><table><tbody>${L.map(x=>`<tr><td class="rk">${x[1]??''}</td><td class="l">${plink(d,x[2])}${isAff(tk,x[2])?affTag():''}</td><td class="l muted">${posAb(x[3])}</td></tr>`).join('')||`<tr><td class="l muted">${t('noRoster')}</td></tr>`}</tbody></table></div>${na?`<p class="note">${t('affCount',na)}</p>`:''}</div>`}).join('')}</div>`:'';
  const h2h=g.h&&g.v?d.games.filter(x=>x!==g&&((x.h===g.h&&x.v===g.v)||(x.h===g.v&&x.v===g.h))):[];
  const sheet=!goals&&!pens&&!lus&&(g.done||g.on)?`<p class="note">${t('noSheet')}${g.sp?` <a href="${lqhfUrl(g)}" target="_blank" rel="noopener">${t('lqhf')}</a>`:''}</p>`:'';

  else if(!g.done&&sides.some(tk=>d.staff[tk]))staff=`<h2>${t('staffT')} <small>${t('staffUsual')}</small></h2><div class="grid2">${sides.map(tk=>{const sf=d.staff[tk];return `<div class="card pad"><h3>${tlink(d,tk,18)}</h3>${sf?teamStaffHTML(d,sf):`<p class="muted">${t('noStaff')}</p>`}</div>`}).join('')}</div>`;
  return `<div class="crumb"><a href="#/${d.key}/schedule">← ${t('schedule')}</a></div>${board}${pred}${g.done?'':watchHTML(d,g)}${staff}${sheet}${goals}${pens}${lus}${h2h.length?`<h2>${t('thisSeason')}</h2>${gList(d,h2h,{flat:true})}`:''}`;
}

/* ---------- player (every league, since affiliates play across divisions) ---------- */
function vPlayer(d,pk){
  const seen=new Set(),log=[];let name='';
  for(const L of IX.leagues.map(l=>DATA[l.key]).filter(Boolean)){
    if(L.players[pk])name=L.players[pk];
    for(const g of L.games){
      if(seen.has(g.id)||!(g.done||g.on)||g.k!=='L')continue;
      const lu=(g.lu||[]).find(x=>x[2]===pk),gl=(g.g||[]).filter(x=>x[3]===pk),as=(g.g||[]).filter(x=>x.slice(4).includes(pk)),pe=(g.p||[]).filter(x=>x[3]===pk);
      if(!lu&&!gl.length&&!as.length&&!pe.length)continue;
      seen.add(g.id);
      const tk=lu?lu[0]:gl[0]?gl[0][0]:as[0]?as[0][0]:pe[0][0];
      /* a goalie: the other goalies of her team in uniform (then the sheet does not say which one played) */
      const og=lu&&isG(lu[3])?(g.lu||[]).filter(y=>y[0]===tk&&y[2]!==pk&&isG(y[3])).map(y=>y[2]):null;
      log.push({L,g,tk,no:lu&&lu[1],pos:lu&&lu[3],og,G:gl.length,A:as.length,PIM:pe.reduce((s,x)=>s+(x[5]||0),0)});
    }
  }
  log.sort((a,b)=>b.g.t0-a.g.t0);
  const teams=[];for(const L of IX.leagues.map(l=>DATA[l.key]).filter(Boolean))for(const[k,rows]of Object.entries(L.roster)){const r=rows.find(x=>x[0]===pk);if(r)teams.push({L,k,r})}
  const c=t('c');
  /* skater stats from the games she did not dress as a goalie; goalie stats (below) from the others */
  const tot={};for(const x of log.filter(x=>!x.og)){const key=x.tk;const r=tot[key]??={L:x.L,tk:x.tk,k:x.g.k,gp:0,g:0,a:0,pim:0};r.gp++;r.g+=x.G;r.a+=x.A;r.pim+=x.PIM}
  const affR=teams.find(x=>x.r[3]),gk=log.some(x=>x.og),sk=log.some(x=>!x.og)||!gk,both=gk&&sk,shared=log.some(x=>x.og&&x.og.length);
  /* a goalie: her goalie stats (the games where she was her team's only goalie), as in the Goalies table */
  const gkStats=()=>{const R=[];for(const L of IX.leagues.map(l=>DATA[l.key]).filter(Boolean))for(const r of GS(L))if(r.pk===pk)R.push({L,r});
    return `<div class="card scroll"><table class="gkst"><thead><tr><th class="l">${c.team}</th><th>${ab('dressed',c.dressed)}</th><th>${ab('gp1',t('gp1'))}</th><th>${ab('wlt',`${c.w}-${c.l}-${c.t}`)}</th><th>${ab('gag',c.ga)}</th><th>${ab('gaa',c.gaa)}</th><th>${ab('so',c.so)}</th></tr></thead><tbody>
    ${R.map(({L,r})=>`<tr><td class="l tn">${tlink(L,r.tk,18)}</td><td>${r.dr}</td><td class="pts">${r.gp}</td><td>${r.w}-${r.l}-${r.t}</td><td>${r.ga}</td><td>${r.gaa!=null?r.gaa.toFixed(2):''}</td><td>${r.so}</td></tr>`).join('')||`<tr><td class="l muted">${t('note0')}</td></tr>`}</tbody></table></div>`};
  return `<div class="crumb"><a href="javascript:history.back()">←</a></div><h2 class="first">${esc(name||'?')}</h2>
  <div class="grid3">${teams.map(x=>`<div class="card pad">${tlink(x.L,x.k,28)}<div class="muted" style="margin-top:6px">${esc(x.L.label)}${x.r[1]!=null?' · #'+x.r[1]:''}${x.r[2]?' · '+esc(x.r[2]):''}${x.r[3]?' <span class="aff">AFF</span>':''}</div></div>`).join('')}</div>
  ${affR?`<p class="note">${t('affiliates')}${t('colon')} ${t('total')} = <b>${affR.r[6]}</b>. ${t('affNote')}</p>`:''}
  <h2>${t('stats')} <small>${t('seasonStats')}</small></h2>${both?`<h3>${t('asSk')}</h3>`:''}${!sk?'':`<div class="card scroll"><table><thead><tr><th class="l">${c.team}</th><th>${ab('gp')}</th><th>${ab('g')}</th><th>${ab('a')}</th><th>${ab('ppts','PTS')}</th><th>${ab('pim')}</th></tr></thead><tbody>
   ${Object.values(tot).map(r=>`<tr><td class="l tn">${tlink(r.L,r.tk,18)}</td><td>${r.gp}</td><td>${r.g}</td><td>${r.a}</td><td class="pts">${r.g+r.a}</td><td>${r.pim}</td></tr>`).join('')||`<tr><td class="l muted">${t('note0')}</td></tr>`}</tbody></table></div>`}${both?`<h3 style="margin-top:14px">${t('asG')}</h3>`:''}${gk?gkStats():''}
  <h2>${t('gameLog')} <small>${t('seasonStats')} · ${log.length}${gk?' · '+t('gkAlone',log.filter(x=>x.og&&!x.og.length).length):''}</small></h2><div class="card scroll"><table><thead><tr><th class="l"></th><th class="l">${t('opp')}</th><th></th><th>${ab('g')}</th><th>${ab('a')}</th><th>${ab('pim')}</th></tr></thead><tbody>
   ${log.map(x=>{const g=x.g,o=g.h===x.tk?g.v:g.h,r=g.done?res(g,x.tk):'';const[a,b]=g.h===x.tk?g.sc:[g.sc[1],g.sc[0]];
     return `<tr${x.og&&x.og.length?' class="gksh"':''}><td class="l"><a href="#/${x.L.key}/game/${g.id}">${dTiny(g.s)}</a></td><td class="l tn">${g.h===x.tk?'':t('at')+' '}${o?tlink(x.L,o,18):''}${x.tk!==log[0].tk||teams.length>1?` <small class="muted">(${esc(tn(x.L,x.tk))})</small>`:''}${both&&x.og?` <span class="aff">${t('gTag')}</span>`:''}${x.og&&x.og.length?`<div class="gkw">${t('gkWith')} ${x.og.map(p=>plink(x.L,p)).join(', ')}</div>`:''}</td><td>${r?`<span class="chip ${r}">${t('R')[r]} ${a}-${b}</span>`:`<span class="chip live">${a}-${b}</span>`}</td><td>${x.G}</td><td>${x.A}</td><td>${x.PIM}</td></tr>`}).join('')}</tbody></table></div>${shared?`<p class="note">${t('gkNote')}</p>`:''}`;
}

/* Newer build check. Opened from the iPhone home screen, the page is resumed as it was, maybe hours old, and GitHub
   Pages lets browsers keep it 10 minutes. So each time the page comes back to the foreground, version.json (fetched
   past every cache) says which build is online; if it is not this one, the page reloads at a new URL (?b=<build>,
   which no cache holds) and keeps its route (the #hash) and language. A build already tried once in this tab is not
   retried, so a cache that still serves the old page cannot cause a reload loop. */
const BUILD='4af789bc0790';
let lastCheck=0;
async function checkBuild(){
  if(Date.now()-lastCheck<30000)return;
  lastCheck=Date.now();
  try{
    const r=await fetch(`version.json?t=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)return;
    const b=(await r.json()).build;
    if(!b||b===BUILD)return;
    let tried=null;try{tried=sessionStorage.getItem('lqhf-build-tried')}catch(e){}
    if(tried===b)return;
    try{sessionStorage.setItem('lqhf-build-tried',b)}catch(e){}
    const q=new URLSearchParams(location.search);q.set('b',b);
    location.replace(`${location.pathname}?${q}${location.hash}`);
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkBuild()});
window.addEventListener('pageshow',e=>{if(e.persisted)checkBuild()});
</script>
<!-- Visit counts (GoatCounter: no cookies, no personal data). One page per category and tab, not per team, game or
     player: /m15b/standings, /m15b/players/goalies, /m15b/game… The page is one HTML file, so each tab change is counted here. -->
<script>
window.goatcounter={no_onload:true};
function gcCount(){
  const g=window.goatcounter;if(!g||!g.count)return;
  const p=location.hash.replace(/^#\/?/,'').split('/'),lk=p[0]||'',v={leaders:'players',goalies:'players'}[p[1]]||p[1]||'overview';
  const sub=v==='players'&&(p[2]==='goalies'||p[1]==='goalies')?'/goalies':'';
  /* no referrer (home-screen icon, typed address, bookmark, link in a text message): name where the visit came from.
     ASCII only: GoatCounter shows the referrer URL-encoded */
  const home=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  g.count({path:lk?`/${lk}/${v}${sub}`:'/',title:document.title,...(document.referrer?{}:{referrer:home?'icone-ecran-accueil':'lien-direct'})});
}
addEventListener('hashchange',gcCount);
</script>
<script data-goatcounter="https://lqhf-dashboard.goatcounter.com/count" async src="//gc.zgo.at/count.js" onload="gcCount()"></script>
