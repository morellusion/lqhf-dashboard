<script>
'use strict';
/* The odds of a game, shared by every site in websites/ (inserted by each build.py): from the two teams' ratings
   (websites/common/ratings.py) and BASE, the average goals per team per game. Each team's goals follow a Poisson law
   whose mean is BASE shifted by half the rating difference (capped at 4, never under 0.3). */
const PRED={
  lam(rh,rv,base){const d=Math.max(-4,Math.min(4,rh-rv));return[Math.max(.3,base+d/2),Math.max(.3,base-d/2)]},
  /* w/t/l: home win, tie, away win; eh/ev: expected goals; sh/sv: the predicted score in whole goals, the most likely
     score of the most likely result (so it agrees with the odds). */
  odds(rh,rv,base){
    const[mh,mv]=PRED.lam(rh,rv,base),pm=m=>{const p=[Math.exp(-m)];for(let i=1;i<=15;i++)p.push(p[i-1]*m/i);return p},ph=pm(mh),pv=pm(mv);
    let w=0,t=0,l=0;const best=[[0,0,-1],[0,0,-1],[0,0,-1]];
    for(let i=0;i<=15;i++)for(let j=0;j<=15;j++){const p=ph[i]*pv[j],o=i>j?0:i===j?1:2;if(o===0)w+=p;else if(o===2)l+=p;else t+=p;if(p>best[o][2])best[o]=[i,j,p]}
    const s=w+t+l,top=w>=t&&w>=l?0:l>=t?2:1;
    return{w:w/s,t:t/s,l:l/s,eh:mh,ev:mv,sh:best[top][0],sv:best[top][1]};
  }

/* ---------- season simulation (seeded, so the numbers are stable for a given data version) ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let x=Math.imul(a^(a>>>15),1|a);x=(x+Math.imul(x^(x>>>7),61|x))^x;return((x^(x>>>14))>>>0)/4294967296}}
function SIM(d){
  if(d._sim)return d._sim;
  const N=4000,R=rng(parseInt(String(lmeta(d.key).v).slice(0,8),16)||1);
  const teams=d.standings.map(s=>s.t),idx=Object.fromEntries(teams.map((k,i)=>[k,i])),n=teams.length;
  const rem=d.games.filter(g=>g.k==='L'&&!g.done&&g.h&&g.v&&g.st!=='cancelled'&&idx[g.h]!=null&&idx[g.v]!=null);
  const pools=d.pools.map(p=>teams.filter(k=>d.stand[k].pool===p).map(k=>idx[k]));
  const r=teams.map(k=>(d.ratings[k]||{r:0}).r),sd=teams.map(k=>(d.ratings[k]||{sd:1.6}).sd);
  const rk=teams.map(()=>new Float64Array(n+1)),pts=new Float64Array(n),first=new Float64Array(n);
  const P=new Float64Array(n),GD=new Float64Array(n),S=new Float64Array(n);
  const pois=m=>{const L=Math.exp(-m);let k=0,p=1;do{k++;p*=R()}while(p>L);return k-1};
  const gauss=()=>{let u=0;while(!u)u=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*R())};
  const left=new Int32Array(n),oppSum=new Float64Array(n);
  for(const g of rem){const h=idx[g.h],v=idx[g.v];left[h]++;left[v]++;oppSum[h]+=r[v];oppSum[v]+=r[h]}
  const G=rem.map(g=>[idx[g.h],idx[g.v]]);
  for(let s=0;s<N;s++){
    for(let i=0;i<n;i++){const st=d.stand[teams[i]];P[i]=st.pts;GD[i]=st.gf-st.ga;S[i]=r[i]+gauss()*sd[i]}
    for(const[h,v]of G){const[mh,mv]=PRED.lam(S[h],S[v],d.base),a=pois(mh),b=pois(mv);
      if(a>b){P[h]+=3;P[v]+=1}else if(a<b){P[v]+=3;P[h]+=1}else{P[h]+=2;P[v]+=2}GD[h]+=a-b;GD[v]+=b-a}
    for(const pl of pools){const o=pl.map(i=>[i,P[i],GD[i],R()]).sort((x,y)=>y[1]-x[1]||y[2]-x[2]||y[3]-x[3]);o.forEach(([i],j)=>{rk[i][j+1]++;if(!j)first[i]++})}
    for(let i=0;i<n;i++)pts[i]+=P[i];
  }
  const out={};teams.forEach((k,i)=>{const pl=pools.find(p=>p.includes(i))||[];const dist=[...rk[i]].slice(1,pl.length+1).map(x=>x/N);
    out[k]={pts:pts[i]/N,first:first[i]/N,rank:dist.reduce((s,p,j)=>s+p*(j+1),0),dist,left:left[i],rsos:left[i]?oppSum[i]/left[i]:null}});
  return d._sim={N,teams:out,rem:rem.length};
}

function TI(d,k){

  for(const g of lg){
    for(const x of g.g||[]){const p=String(x[1]);(x[0]===k?per.f:per.a)[p]=((x[0]===k?per.f:per.a)[p]||0)+1}
    for(const x of g.p||[])if(x[0]===k){pim+=x[5]||0;infc[x[4]]=(infc[x[4]]||0)+1}
    const r=res(g,k);split[g.h===k?'h':'v']['WLT'.indexOf(r)]++;
  }
  return d._ti[k]={all,lg,form:R.slice(-5),streak:R.length?[R[R.length-1],sk]:null,pim,per,split,infc,
    live:all.find(g=>g.on),next:all.find(g=>!g.done&&!g.on&&g.st==='scheduled'&&g.t1>now),last:[...all].reverse().find(g=>g.done)};
}
const formHTML=f=>`<span class="form" data-tip="${esc(tipOf('form'))}">${f.map(r=>`<i class="${r}">${t('R')[r]}</i>`).join('')}</span>`;
const streakTxt=s=>s?t('str'+s[0],s[1]):'';

/* Player stats per (player, team) pair, regular-season games only (tournaments and exhibitions never count). */
function PS(d){
  if(d._ps)return d._ps;
  const M=new Map(),get=(pk,tk)=>{const k=pk+'|'+tk;let r=M.get(k);if(!r)M.set(k,r={pk,tk,gp:0,g:0,a:0,pim:0,no:null,pos:''});return r};
  for(const g of d.games){
    if(!(g.done||g.on)||g.k!=='L')continue;
    for(const[tk,no,pk,pos]of g.lu||[]){if(!pk)continue;const r=get(pk,tk);r.gp++;if(no!=null)r.no=no;if(pos)r.pos=pos}
    for(const[tk,,,s,...as]of g.g||[]){if(s)get(s,tk).g++;as.forEach(a=>a&&get(a,tk).a++)}
    for(const[tk,,,pl,,min]of g.p||[])if(pl)get(pl,tk).pim+=min||0;
  }
  const out=[...M.values()];
  for(const r of out){r.pts=r.g+r.a;const ro=d.rmap[r.tk]&&d.rmap[r.tk][r.pk];if(ro){if(ro[1]!=null)r.no=ro[1];r.pos=r.pos||ro[2];r.aff=!!ro[3]}}
  return d._ps=out;
}
function GS(d){
  if(d._gs)return d._gs;const M=new Map(),get=(pk,tk)=>{const k=pk+'|'+tk;let r=M.get(k);if(!r)M.set(k,r={pk,tk,dr:0,gp:0,w:0,l:0,t:0,ga:0,so:0,no:null});return r};
  for(const g of d.games){
    if(!g.done||g.k!=='L'||!g.lu)continue;
    for(const[tk,gf,ga]of[[g.h,g.sc[0],g.sc[1]],[g.v,g.sc[1],g.sc[0]]]){
      const gs=g.lu.filter(x=>x[0]===tk&&isG(x[3])&&x[2]);gs.forEach(x=>{const r=get(x[2],tk);r.dr++;if(x[1]!=null)r.no=x[1]});
      if(gs.length===1){const r=get(gs[0][2],tk);r.gp++;r.ga+=ga;r.so+=ga===0?1:0;r[gf>ga?'w':gf<ga?'l':'t']++}
    }
  }
  return d._gs=[...M.values()].map(r=>({...r,gaa:r.gp?r.ga/r.gp:null}));
}

let timer=null;
async function render(scroll){
  const r=parse();CUR=r;chrome(r);

    let html;

/* ---------- shared pieces ---------- */
function gRow(d,g,o={}){
  const side=w=>{const k=g[w];return k?`<span class="tl">${logo(d,k,22)}<span>${esc(tn(d,k))}</span></span>`:`<span class="tl"><span>${esc(g[w+'p']||'?')}</span></span>`};
  const sc=(g.done||g.on)&&g.sc,hw=sc&&g.sc[0]>g.sc[1],vw=sc&&g.sc[1]>g.sc[0];
  let chip;
  if(g.on)chip=`<span class="chip live">${t('live')}</span>`;
  else if(g.done&&o.team&&(g.h===o.team||g.v===o.team)){const r=res(g,o.team);chip=`<span class="chip ${r}">${t('R')[r]}</span>`}
  else if(g.done)chip=`<span class="chip final">${t('st').played}</span>`;
  else if(g.st==='postponed'||g.st==='cancelled')chip=`<span class="chip off">${t('st')[g.st]}</span>`;
  else chip=g.k==='L'?'':`<span class="chip ${g.k==='T'?'T_':'X'}" data-tip="${esc(g.k==='T'?compLab(d,g):tipOf('X'))}">${t('compShort')[g.k]}</span>`;
  const meCls=k=>k&&(k===o.team||k===FAV())?' me':'';
  const sub=o.date?dTiny(g.s):(g.k==='T'?t('compShort').T:g.k==='X'?t('compShort').X:'');
  return `<li><a class="gr" href="#/${d.key}/game/${g.id}"><div class="tm">${hm(g.s)}<small>${esc(sub)}</small></div>
  <div class="sides"><div class="${g.v?'':'ph'}${meCls(g.v)}">${side('v')}${sc?`<span class="sc ${vw?'w':''}">${g.sc[1]}</span>`:''}</div><div class="${g.h?'':'ph'}${meCls(g.h)}">${side('h')}${sc?`<span class="sc ${hw?'w':''}">${g.sc[0]}</span>`:''}</div></div>${chip||'<span></span>'}</a></li>`;
}
function gList(d,games,o={}){
  if(!games.length)return `<div class="card empty">${t('noGames')}</div>`;
  if(o.flat)return `<ul class="gl card">${games.map(g=>gRow(d,g,{...o,date:true})).join('')}</ul>`;
  let out='',cur=null,buf=[];
  const flush=()=>{if(buf.length)out+=`<div class="day">${dLong(buf[0].s)}${dayKey(buf[0].s)===TODAY()?' · '+t('today'):''}</div><ul class="gl card">${buf.map(g=>gRow(d,g,o)).join('')}</ul>`;buf=[]};
  for(const g of games){const k=dayKey(g.s);if(k!==cur){flush();cur=k}buf.push(g)}flush();return out;
}

/* Players to watch in a coming game: each team's top 3 scorers and its main goalie, regular season only (like every

function watchHTML(d,g){

/* ---------- game ---------- */
function vGame(d,id){

  const status=g.on?`<span class="chip live">${t('live')}${g.live&&g.live.period?' · '+esc(t('perS',String(g.live.period))):''}</span>`:g.done?`<span class="chip final">${t('st').played}</span>`:`<span class="chip${g.st!=='scheduled'?' off':''}">${t('st')[g.st]||g.st}</span>`;
  const board=`<div class="card board"><div class="meta">${esc(compLab(d,g))} · ${t('number',g.n)}</div>
   <div class="vs">${side('v')}<div><div class="big ${sc?'':'tbd'}">${sc?`${g.sc[1]} – ${g.sc[0]}`:t('vs')}</div><div style="margin-top:8px">${status}</div></div>${side('h')}</div>
   <div class="facts"><span>${dLong(g.s)} · ${hm(g.s)}</span>${a?`<span>${esc(a.n)}${a.c?', '+esc(a.c):''} · <a href="${mapUrl(a)}" target="_blank" rel="noopener">${t('map')}</a></span>`:''}${g.sp?`<span><a href="${lqhfUrl(g)}" target="_blank" rel="noopener">${t('lqhf')}</a></span>`:''}${g.k==='T'&&d.tourn[g.tn]&&d.tourn[g.tn].url?`<span><a href="${d.tourn[g.tn].url}#game-${encodeURIComponent(g.n)}" target="_blank" rel="noopener">${t('tSiteGame')} ↗</a></span>`:''}</div></div>`;
  const pred=!g.done&&!g.on&&g.h&&g.v?(()=>{const o=odds(d,g.h,g.v),un=[g.h,g.v].filter(k=>!d.ratings[k]);return `<h2>${t('pred')}</h2><div class="card pad">${oddsHTML(d,g.h,g.v)}<p class="note" style="margin-top:10px">${t('expected')}${t('colon')} <b>${esc(tn(d,g.v))} ${o.sv} – ${o.sh} ${esc(tn(d,g.h))}</b>. ${un.length?t('unrated',un.map(k=>tn(d,k)).join(', '))+' ':''}${t('predNote')}</p></div>`})():'';
  const no=(tk,pk)=>{const l=(g.lu||[]).find(x=>x[0]===tk&&x[2]===pk);const ro=d.rmap[tk]&&d.rmap[tk][pk];const n=l&&l[1]!=null?l[1]:ro&&ro[1];return n!=null?`<small class="muted">#${n}</small> `:''};
  /* the lineup's own flag (she dressed for this game as an affiliate) wins; the roster when the lineup does not say */
  const isAff=(tk,pk)=>{const l=(g.lu||[]).find(x=>x[0]===tk&&x[2]===pk);if(l&&l[4]!=null)return l[4]===1;const ro=d.rmap[tk]&&d.rmap[tk][pk];return !!(ro&&ro[3])};
  const pers=[...new Set([...(g.g||[]),...(g.p||[])].map(x=>String(x[1])))].sort((a,b)=>(a==='OT'?4:a==='SO'?5:+a)-(b==='OT'?4:b==='SO'?5:+b));
  let line='';
  if(g.g&&g.g.length){const cnt=(tk,p)=>g.g.filter(x=>x[0]===tk&&String(x[1])===p).length;
    line=`<div class="card scroll" style="margin-bottom:12px"><table><thead><tr><th class="l"></th>${pers.map(p=>`<th>${esc(t('perS',p))}</th>`).join('')}<th>T</th></tr></thead><tbody>${[g.v,g.h].map(tk=>`<tr><td class="l">${tlink(d,tk,18)}</td>${pers.map(p=>`<td>${cnt(tk,p)}</td>`).join('')}<td class="pts">${g.g.filter(x=>x[0]===tk).length}</td></tr>`).join('')}</tbody></table></div>`}
  const evs=(arr,f)=>pers.map(p=>{const xs=arr.filter(x=>String(x[1])===p);return xs.length?`<li class="per">${esc(t('per',p))}</li>`+xs.map(f).join(''):''}).join('');
  const goals=g.g&&g.g.length?`<h2>${t('goals')}</h2>${line}<ul class="ev card">${evs(g.g,x=>`<li><span class="tm">${esc(x[2]||'')}</span>${logo(d,x[0],22)}<span>${no(x[0],x[3])}<b>${plink(d,x[3])}</b>${x.slice(4).filter(Boolean).length?` <small>(${x.slice(4).filter(Boolean).map(p=>plink(d,p)).join(', ')})</small>`:''}</span></li>`)}</ul>`:'';
  const pens=g.p&&g.p.length?`<h2>${t('penalties')}</h2><ul class="ev card">${evs(g.p,x=>`<li><span class="tm">${esc(x[2]||'')}</span>${logo(d,x[0],22)}<span>${no(x[0],x[3])}${plink(d,x[3])} <small>· ${esc(inf(x[4]))} · ${x[5]} min</small></span></li>`)}</ul>`:'';
  const lus=g.lu&&g.lu.length?`<h2>${t('lineups')}</h2><div class="grid2">${[g.v,g.h].filter(Boolean).map(tk=>{const L=g.lu.filter(x=>x[0]===tk).sort((a,b)=>(isG(b[3])-isG(a[3]))||((a[1]??999)-(b[1]??999)));const na=L.filter(x=>isAff(tk,x[2])).length;
     return `<div><h3>${tlink(d,tk,18)}</h3><div class="card scroll"><table><tbody>${L.map(x=>`<tr><td class="rk">${x[1]??''}</td><td class="l">${plink(d,x[2])}${isAff(tk,x[2])?affTag():''}</td><td class="l muted">${posAb(x[3])}</td></tr>`).join('')||`<tr><td class="l muted">${t('noRoster')}</td></tr>`}</tbody></table></div>${na?`<p class="note">${t('affCount',na)}</p>`:''}</div>`}).join('')}</div>`:'';
  const h2h=g.h&&g.v?d.games.filter(x=>x!==g&&((x.h===g.h&&x.v===g.v)||(x.h===g.v&&x.v===g.h))):[];
  const sheet=!goals&&!pens&&!lus&&(g.done||g.on)?`<p class="note">${t('noSheet')}${g.sp?` <a href="${lqhfUrl(g)}" target="_blank" rel="noopener">${t('lqhf')}</a>`:''}</p>`:'';
  const sides=[g.v,g.h].filter(Boolean);let staff='';
  if(g.sf&&g.sf.length)staff=`<h2>${t('staffT')}</h2><div class="grid2">${sides.map(tk=>{const rows=g.sf.filter(r=>r[0]===tk).map(r=>[r[1],r[2]]);return `<div class="card pad"><h3>${tlink(d,tk,18)}</h3>${rows.length?staffHTML(rows):`<p class="muted">${t('noStaff')}</p>`}</div>`}).join('')}</div>`;
  else if(!g.done&&sides.some(tk=>d.staff[tk]))staff=`<h2>${t('staffT')} <small>${t('staffUsual')}</small></h2><div class="grid2">${sides.map(tk=>{const sf=d.staff[tk];return `<div class="card pad"><h3>${tlink(d,tk,18)}</h3>${sf?`${staffHTML(sf.sf)}<p class="note">${t('staffFrom')} <a href="#/${d.key}/game/${sf.g}">${d.byId[sf.g]?dTiny(d.byId[sf.g].s):''}</a>.</p>`:`<p class="muted">${t('noStaff')}</p>`}</div>`}).join('')}</div>`;
  return `<div class="crumb"><a href="#/${d.key}/schedule">← ${t('schedule')}</a></div>${board}${pred}${g.done?'':watchHTML(d,g)}${staff}${sheet}${goals}${pens}${lus}${h2h.length?`<h2>${t('thisSeason')}</h2>${gList(d,h2h,{flat:true})}`:''}`;
}

/* ---------- player (every league, since affiliates play across divisions) ---------- */
function vPlayer(d,pk){
  const seen=new Set(),log=[];let name='';
  for(const L of IX.leagues.map(l=>DATA[l.key]).filter(Boolean)){
    if(L.players[pk])name=L.players[pk];
    for(const g of L.games){
      if(seen.has(g.id)||!(g.done||g.on)||g.k!=='L')continue;
      const lu=(g.lu||[]).find(x=>x[2]===pk),gl=(g.g||[]).filter(x=>x[3]===pk),as=(g.g||[]).filter(x=>x.slice(4).includes(pk)),pe=(g.p||[]).filter(x=>x[3]===pk);
      if(!lu&&!gl.length&&!as.length&&!pe.length)continue;
      seen.add(g.id);
      const tk=lu?lu[0]:gl[0]?gl[0][0]:as[0]?as[0][0]:pe[0][0];
      log.push({L,g,tk,no:lu&&lu[1],pos:lu&&lu[3],G:gl.length,A:as.length,PIM:pe.reduce((s,x)=>s+(x[5]||0),0)});
    }
  }
  log.sort((a,b)=>b.g.t0-a.g.t0);
  const teams=[];for(const L of IX.leagues.map(l=>DATA[l.key]).filter(Boolean))for(const[k,rows]of Object.entries(L.roster)){const r=rows.find(x=>x[0]===pk);if(r)teams.push({L,k,r})}
  const c=t('c');
  const tot={};for(const x of log){const key=x.tk;const r=tot[key]??={L:x.L,tk:x.tk,k:x.g.k,gp:0,g:0,a:0,pim:0};r.gp++;r.g+=x.G;r.a+=x.A;r.pim+=x.PIM}
  const affR=teams.find(x=>x.r[3]);
  return `<div class="crumb"><a href="javascript:history.back()">←</a></div><h2 class="first">${esc(name||'?')}</h2>
  <div class="grid3">${teams.map(x=>`<div class="card pad">${tlink(x.L,x.k,28)}<div class="muted" style="margin-top:6px">${esc(x.L.label)}${x.r[1]!=null?' · #'+x.r[1]:''}${x.r[2]?' · '+esc(x.r[2]):''}${x.r[3]?' <span class="aff">AFF</span>':''}</div></div>`).join('')}</div>
  ${affR?`<p class="note">${t('affiliates')}${t('colon')} ${t('total')} = <b>${affR.r[6]}</b>. ${t('affNote')}</p>`:''}
  <h2>${t('stats')} <small>${t('seasonStats')}</small></h2><div class="card scroll"><table><thead><tr><th class="l">${c.team}</th><th>${ab('gp')}</th><th>${ab('g')}</th><th>${ab('a')}</th><th>${ab('ppts','PTS')}</th><th>${ab('pim')}</th></tr></thead><tbody>
   ${Object.values(tot).map(r=>`<tr><td class="l tn">${tlink(r.L,r.tk,18)}</td><td>${r.gp}</td><td>${r.g}</td><td>${r.a}</td><td class="pts">${r.g+r.a}</td><td>${r.pim}</td></tr>`).join('')||`<tr><td class="l muted">${t('note0')}</td></tr>`}</tbody></table></div>
  <h2>${t('gameLog')} <small>${t('seasonStats')} · ${log.length}</small></h2><div class="card scroll"><table><thead><tr><th class="l"></th><th class="l">${t('opp')}</th><th></th><th>${ab('g')}</th><th>${ab('a')}</th><th>${ab('pim')}</th></tr></thead><tbody>
   ${log.map(x=>{const g=x.g,o=g.h===x.tk?g.v:g.h,r=g.done?res(g,x.tk):'';const[a,b]=g.h===x.tk?g.sc:[g.sc[1],g.sc[0]];
     return `<tr><td class="l"><a href="#/${x.L.key}/game/${g.id}">${dTiny(g.s)}</a></td><td class="l tn">${g.h===x.tk?'':t('at')+' '}${o?tlink(x.L,o,18):''}${x.tk!==log[0].tk||teams.length>1?` <small class="muted">(${esc(tn(x.L,x.tk))})</small>`:''}</td><td>${r?`<span class="chip ${r}">${t('R')[r]} ${a}-${b}</span>`:`<span class="chip live">${a}-${b}</span>`}</td><td>${x.G}</td><td>${x.A}</td><td>${x.PIM}</td></tr>`}).join('')}</tbody></table></div>`;
}

render();
</script>
